<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Media Publisher</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Social Media Publisher</h1>

      <form
        id="publish-form"
        action="/api/publish"
        method="POST"
        enctype="multipart/form-data"
        novalidate
      >
        <div
          id="form-error"
          class="form-error"
          role="alert"
          tabindex="-1"
          hidden
        ></div>

        <div class="field">
          <label for="post-text">Post text</label>
          <textarea
            id="post-text"
            name="text"
            rows="5"
            aria-describedby="char-counters"
            aria-invalid="false"
          ></textarea>
          <div id="char-counters" class="counters" aria-live="off"></div>
        </div>

        <div class="field">
          <label for="post-image">
            Image
            <span class="label-note">(optional for Facebook &amp; Threads; required JPEG for Instagram)</span>
          </label>
          <p id="image-hint" class="hint">
            Instagram requires a JPEG image (.jpg or .jpeg, max 8 MB).
          </p>
          <input
            type="file"
            id="post-image"
            name="image"
            accept="image/*"
            aria-describedby="image-hint"
            aria-invalid="false"
          />
        </div>

        <fieldset id="platforms-fieldset" class="field">
          <legend>Platforms</legend>
          <div class="checkbox-group">
            <div class="checkbox-row">
              <input
                type="checkbox"
                id="platform-facebook"
                name="platforms"
                value="facebook"
                checked
              />
              <label for="platform-facebook">Facebook</label>
            </div>
            <div class="checkbox-row">
              <input
                type="checkbox"
                id="platform-instagram"
                name="platforms"
                value="instagram"
                checked
              />
              <label for="platform-instagram">Instagram</label>
            </div>
            <div class="checkbox-row">
              <input
                type="checkbox"
                id="platform-threads"
                name="platforms"
                value="threads"
                checked
              />
              <label for="platform-threads">Threads</label>
            </div>
          </div>
        </fieldset>

        <button id="publish-btn" type="submit" class="publish-btn">
          Publish
        </button>
      </form>

      <section id="results-section" class="results-section" hidden>
        <h2>Publish results</h2>
        <p
          id="results-status"
          class="visually-hidden"
          role="status"
          aria-live="polite"
        ></p>
        <ul id="results-list" class="results-list" role="list"></ul>
      </section>
    </main>
  </body>
</html>
